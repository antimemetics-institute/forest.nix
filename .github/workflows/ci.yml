name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NixOS/nix-installer-action@main as of 2026-06-07
      - uses: NixOS/nix-installer-action@6b8548fe06acfb0155a50ab5d561accb215764cc
      - name: Build checks
        # nix flake check swallows build logs even with -L; nix build streams them.
        run: nix build -L --no-link .#checks.x86_64-linux.tests .#checks.x86_64-linux.cli

  imperative-smoke:
    # Boot the minimal imperative VM for real — rootless userns, virtiofsd,
    # slirp, vsock ssh — and prove the cwd share is served. Guards against
    # dependency drift in the parts host-eval tests can't see (e.g. virtiofsd
    # 1.14 silently breaking symlinked --shared-dir sources).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NixOS/nix-installer-action@main as of 2026-06-07
      - uses: NixOS/nix-installer-action@6b8548fe06acfb0155a50ab5d561accb215764cc
      - name: Make /dev/kvm and /dev/vhost-vsock usable by the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm-all-users.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo modprobe vhost_vsock
          sudo chmod 666 /dev/vhost-vsock
      - name: Allow full unprivileged user namespaces
        # Ubuntu 23.10+ AppArmor confines unprivileged userns creators to a
        # profile without capabilities, so forest-run-vm's mount-ns setup fails
        # with "cannot change root filesystem propagation: Permission denied".
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Boot the minimal VM and check the cwd share
        # The launcher's exit code is the ssh session's, so assert on a marker
        # instead. timeout turns a wedged boot (the failure mode this job
        # exists for) into a failure instead of a 6h hang.
        run: |
          timeout 900 nix run .#default -- \
            sh -c 'mountpoint /run/forest/fshare0 && echo SMOKE_OK' | tee smoke.log
          grep -q SMOKE_OK smoke.log
